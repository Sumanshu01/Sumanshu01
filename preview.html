<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sumanshu Jindal - GitHub Profile Preview</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      padding: 30px 15px;
      margin: 0;
    }
    .preview-header {
      max-width: 960px;
      margin: 0 auto 20px auto;
      padding: 12px 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: #238636;
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 960px;
      margin: 0 auto;
      padding: 35px;
      border: 1px solid #30363d;
      border-radius: 12px;
      background-color: #0d1117;
    }
    .markdown-body table {
      display: table;
      width: 100%;
    }
    img {
      max-width: 100%;
    }
  </style>
</head>
<body>

  <div class="preview-header">
    <div>
      <strong>✨ Local GitHub Profile README Live Preview</strong>
      <span style="color: #8b949e; font-size: 13px; margin-left: 10px;">Sumanshu01 / README.md</span>
    </div>
    <span class="badge">Live Rendered</span>
  </div>

  <article id="content" class="markdown-body">
    Loading preview...
  </article>

  <script>
    fetch('README.md')
      .then(response => response.text())
      .then(text => {
        marked.setOptions({
          gfm: true,
          breaks: true
        });
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = '<p>To preview with fetch, serve locally or view directly in GitHub. Error: ' + err + '</p>';
      });
  </script>
</body>
</html>
